version: 0.1.1
name: REVENUE_SEMANTIC_VIEW
description: 'Revenue Pulse: synthetic B2B revenue vs target by month, region, segment, account, and product. Data through
  2026-09-30.'
ai_context: Data is monthly and complete through September 2026. Last quarter or Q3 means months 2026-07-01 through 2026-09-01.
  Ratios are 0-1; present as percentages. Year-over-year compares the same months one year earlier.
datasets:
- name: CUSTOMERS
  source: TEMP.CNANTASENAMAT.CUSTOMERS
  primary_key:
  - CUSTOMER_ID
  description: Customer accounts with sales region and segment
  ai_context: Also called accounts or clients.
  fields:
  - name: CUSTOMER_ID
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: CUSTOMER_ID
    description: Customer identifier
    dimension:
      is_time: false
  - name: CUSTOMER_NAME
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: CUSTOMER_NAME
    description: Customer account name
    dimension:
      is_time: false
    ai_context: Also called account name.
  - name: REGION
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: REGION
    description: 'Sales region: Americas, EMEA, APAC'
    dimension:
      is_time: false
    ai_context: Also called geo or territory.
  - name: SEGMENT
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: SEGMENT
    description: 'Customer segment: Enterprise, Mid-market, SMB'
    dimension:
      is_time: false
- name: PRODUCTS
  source: TEMP.CNANTASENAMAT.PRODUCTS
  primary_key:
  - PRODUCT_ID
  description: Product lines
  ai_context: Also called product lines.
  fields:
  - name: PRODUCT_ID
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: PRODUCT_ID
    description: Product identifier
    dimension:
      is_time: false
  - name: PRODUCT_NAME
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: PRODUCT_NAME
    description: Product line name
    dimension:
      is_time: false
    ai_context: Also called product.
- name: REVENUE
  source: TEMP.CNANTASENAMAT.REVENUE_MONTHLY
  primary_key:
  - REVENUE_ID
  description: Monthly revenue, target, and cost per customer and product. Synthetic.
  fields:
  - name: REVENUE_ID
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: REVENUE_ID
    description: 'Row identifier: customer, product, and month'
    dimension:
      is_time: false
  - name: CUSTOMER_ID
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: CUSTOMER_ID
    description: Customer identifier (foreign key)
    dimension:
      is_time: false
  - name: PRODUCT_ID
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: PRODUCT_ID
    description: Product identifier (foreign key)
    dimension:
      is_time: false
  - name: MONTH
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: MONTH
    description: First day of the revenue month
    dimension:
      is_time: true
    ai_context: Also called period or date.
  - name: QUARTER
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: DATE_TRUNC('QUARTER', MONTH)
    description: First day of the calendar quarter
    dimension:
      is_time: true
  - name: YEAR
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: YEAR(MONTH)
    description: Calendar year
    dimension:
      is_time: false
  - name: RECORDED_DRIVER
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: RECORDED_DRIVER
    description: 'Driver recorded by sales ops: NORMAL_TRADING, RECORDED_CONTRACT_DOWNSIZE, RECORDED_DISCOUNT_AND_SERVICE_CREDIT,
      RECORDED_RENEWAL_DELAY'
    dimension:
      is_time: false
  - name: GROSS_REVENUE_USD
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: GROSS_REVENUE_CENTS / 100
    description: List revenue before discounts and refunds, USD
  - name: DISCOUNT_USD
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: DISCOUNT_CENTS / 100
    description: Discounts granted, USD
  - name: REFUND_USD
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: REFUND_CENTS / 100
    description: Refunds and service credits, USD
  - name: NET_REVENUE_USD
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: (GROSS_REVENUE_CENTS - DISCOUNT_CENTS - REFUND_CENTS) / 100
    description: Gross revenue minus discounts and refunds, USD
  - name: COST_USD
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: COST_CENTS / 100
    description: Cost of revenue, USD
  - name: TARGET_USD
    expression:
      dialects:
      - dialect: SNOWFLAKE
        expression: TARGET_CENTS / 100
    description: Revenue target, USD
relationships:
- name: REVENUE_TO_CUSTOMERS
  from: REVENUE
  to: CUSTOMERS
  from_columns:
  - CUSTOMER_ID
  to_columns:
  - CUSTOMER_ID
- name: REVENUE_TO_PRODUCTS
  from: REVENUE
  to: PRODUCTS
  from_columns:
  - PRODUCT_ID
  to_columns:
  - PRODUCT_ID
metrics:
- name: NET_REVENUE
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.NET_REVENUE_USD)
  description: 'Net revenue in USD: gross minus discounts and refunds'
  ai_context: Also called revenue or sales.
- name: GROSS_REVENUE
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.GROSS_REVENUE_USD)
  description: Gross revenue in USD
- name: TOTAL_DISCOUNTS
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.DISCOUNT_USD)
  description: Total discounts in USD
- name: TOTAL_REFUNDS
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.REFUND_USD)
  description: Total refunds and service credits in USD
- name: REVENUE_TARGET
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.TARGET_USD)
  description: Revenue target in USD
  ai_context: Also called quota or plan.
- name: TARGET_VARIANCE
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.NET_REVENUE_USD) - SUM(REVENUE.TARGET_USD)
  description: Net revenue minus target in USD; negative means behind target
  ai_context: Also called gap or shortfall.
- name: TARGET_ATTAINMENT
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: DIV0NULL(SUM(REVENUE.NET_REVENUE_USD), SUM(REVENUE.TARGET_USD))
  description: Net revenue divided by target, as a ratio (0.92 = 92%)
- name: GROSS_PROFIT
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: SUM(REVENUE.NET_REVENUE_USD) - SUM(REVENUE.COST_USD)
  description: Net revenue minus cost in USD
- name: GROSS_MARGIN
  expression:
    dialects:
    - dialect: SNOWFLAKE
      expression: DIV0NULL(SUM(REVENUE.NET_REVENUE_USD) - SUM(REVENUE.COST_USD), SUM(REVENUE.NET_REVENUE_USD))
  description: Gross profit divided by net revenue, as a ratio; null when net revenue is zero
